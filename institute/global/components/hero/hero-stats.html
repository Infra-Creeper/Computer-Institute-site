<!--
  Component: hero-stats.html
  Purpose: Statistics banner displaying key metrics (students trained, courses
           offered, success rate). Supports animated counters via HTMX.

  Context Variables:
    - stats (list of dicts) — Each: { label (str), value (int), suffix (str, optional, e.g. "+", "%") }
      If not provided, uses defaults: students, courses, success_rate, instructors.

  HTMX Hooks:
    - Optional animated counter trigger:
      hx-get="{% url 'stats:count' %}"
      hx-trigger="revealed"
      hx-target="#stat-counter-0" hx-swap="innerHTML"
    - Counters can be lazy-loaded on scroll reveal.

  SEO Notes:
    - Uses <section> with descriptive aria-label.
    - Numbers use <strong> for emphasis.

  Dependencies:
    - Tailwind CSS (utility classes)
    - Optional: stat-counter.html for animated counter animation
-->

<section
  class="bg-steel-blue-600 dark:bg-steel-blue-800 py-12 lg:py-16"
  aria-label="Institute statistics"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8">
      {% for stat in stats %}
        <div
          class="text-center"
          id="stat-counter-{{ forloop.counter0 }}"
        >
          <div class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-2">
            <strong
              {% if stat.url_name %}
                hx-get="{% url stat.url_name %}"
                hx-trigger="revealed"
                hx-swap="innerHTML"
              {% endif %}
            >
              {{ stat.value|default:"0" }}{{ stat.suffix|default:"" }}
            </strong>
          </div>
          <p class="text-steel-blue-100 dark:text-steel-blue-200 text-sm sm:text-base font-medium uppercase tracking-wide">
            {{ stat.label }}
          </p>
        </div>
      {% empty %}
        <!-- Default stats if none provided -->
        <div class="text-center" id="stat-counter-0">
          <div class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-2">
            <strong>5000+</strong>
          </div>
          <p class="text-steel-blue-100 dark:text-steel-blue-200 text-sm sm:text-base font-medium uppercase tracking-wide">
            Students Trained
          </p>
        </div>
        <div class="text-center" id="stat-counter-1">
          <div class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-2">
            <strong>120+</strong>
          </div>
          <p class="text-steel-blue-100 dark:text-steel-blue-200 text-sm sm:text-base font-medium uppercase tracking-wide">
            Courses Available
          </p>
        </div>
        <div class="text-center" id="stat-counter-2">
          <div class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-2">
            <strong>95%</strong>
          </div>
          <p class="text-steel-blue-100 dark:text-steel-blue-200 text-sm sm:text-base font-medium uppercase tracking-wide">
            Success Rate
          </p>
        </div>
        <div class="text-center" id="stat-counter-3">
          <div class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-2">
            <strong>50+</strong>
          </div>
          <p class="text-steel-blue-100 dark:text-steel-blue-200 text-sm sm:text-base font-medium uppercase tracking-wide">
            Expert Instructors
          </p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
