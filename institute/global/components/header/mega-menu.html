<!--
  Component: mega-menu.html
  Purpose: Expandable dropdown mega-menu for course categories.
           Supports multi-column layout for large category sets.
           Triggered via HTMX or JavaScript toggle from navbar.

  Context Variables:
    - categories (list of dicts) — Each: { name (str), url_name (str), slug (str), icon_url (str, optional), subcategories (list of dicts, optional) }

  HTMX Hooks:
    - Can be loaded dynamically via:
      hx-get="{% url 'categories:list' %}"
      hx-trigger="mouseover delay:200ms"
      hx-target="#mega-menu-content"
      hx-swap="innerHTML"

  SEO Notes:
    - Uses <section> with aria-label for landmark navigation.
    - All links use proper <a> elements for crawlability.

  Dependencies:
    - Tailwind CSS (utility classes)
    - Triggered from navbar.html toggle button
-->

<section
  id="mega-menu"
  class="hidden absolute left-0 right-0 top-full bg-white dark:bg-jet-black-900 border-b border-steel-blue-200 dark:border-jet-black-700 shadow-lg z-40"
  aria-label="Course categories"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      {% for category in categories %}
        <article class="group">
          <h3 class="text-lg font-semibold text-steel-blue-700 dark:text-almond-cream-100 mb-2">
            <a
              href="{% url category.url_name slug=category.slug %}"
              class="hover:text-steel-blue-500 dark:hover:text-steel-blue-400 transition-colors flex items-center gap-2"
            >
              {% if category.icon_url %}
                <img src="{{ category.icon_url }}" alt="" class="h-5 w-5" loading="lazy" aria-hidden="true" />
              {% endif %}
              {{ category.name }}
            </a>
          </h3>

          {% if category.subcategories %}
            <ul class="space-y-1">
              {% for sub in category.subcategories %}
                <li>
                  <a
                    href="{% url sub.url_name slug=sub.slug %}"
                    class="text-sm text-jet-black-800 dark:text-almond-cream-200 hover:text-steel-blue-600 dark:hover:text-steel-blue-400 transition-colors block py-0.5"
                  >
                    {{ sub.name }}
                  </a>
                </li>
              {% endfor %}
            </ul>
          {% endif %}
        </article>
      {% endfor %}
    </div>
  </div>
</section>
