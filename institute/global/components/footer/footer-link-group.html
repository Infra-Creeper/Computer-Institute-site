<!--
  Component: footer-link-group.html
  Purpose: Organized link section for footer. Renders a titled list of
           navigation links.

  Context Variables:
    - group.title (str) — Required. Section heading.
    - group.items (list of dicts) — Each: { label (str), url_name (str), url_kwargs (dict, optional) }

  HTMX Hooks: None — static link list.

  SEO Notes:
    - Uses <nav> for link groups.
    - Proper heading hierarchy with <h4>.

  Dependencies:
    - Tailwind CSS
-->

<nav aria-label="{{ group.title }}">
  <h4 class="text-sm font-bold text-white uppercase tracking-wider mb-4">
    {{ group.title }}
  </h4>
  <ul class="space-y-2">
    {% for item in group.items %}
      <li>
        <a
          href="{% url item.url_name %}{% if item.url_kwargs %}{% for k, v in item.url_kwargs.items %}/{% if k != 'id' %}{{ k }}/{{ v }}{% else %}{{ v }}{% endif %}{% endfor %}{% endif %}"
          class="text-sm text-almond-cream-300 hover:text-white transition-colors"
        >
          {{ item.label }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
