<!--
  Component: course-filter.html
  Purpose: Sidebar filter component for narrowing course results by category,
           level, price range, and duration. HTMX-enabled for live filtering
           without page reload.

  Context Variables:
    - categories (list of dicts) — Each: { name (str), slug (str), count (int) }
    - levels (list of dicts) — Each: { name (str), slug (str), count (int) }
    - price_ranges (list of dicts) — Each: { label (str), min_price (int), max_price (int), count (int) }
    - durations (list of dicts) — Each: { label (str), weeks_min (int), weeks_max (int), count (int) }
    - selected_category (str, optional) — Currently selected category slug
    - selected_level (str, optional) — Currently selected level slug
    - selected_price (str, optional) — Currently selected price range label
    - selected_duration (str, optional) — Currently selected duration label

  HTMX Hooks:
    - All filter inputs use:
      hx-get="{% url 'courses:filter' %}"
      hx-trigger="change"
      hx-target="#course-grid-container"
      hx-swap="outerHTML"
      hx-include="this.closest('form')"
    - Reset button clears filters and reloads.

  SEO Notes:
    - Uses <aside> semantic element for sidebar.
    - Form uses proper <fieldset> and <legend> for accessibility.

  Dependencies:
    - Tailwind CSS
-->

<aside
  class="bg-white dark:bg-jet-black-800 rounded-xl border border-steel-blue-200 dark:border-jet-black-700 p-6 shadow-sm"
  aria-label="Course filters"
>
  <h2 class="text-lg font-bold text-jet-black-900 dark:text-almond-cream-50 mb-4">
    Filter Courses
  </h2>

  <form
    hx-get="{% url 'courses:filter' %}"
    hx-trigger="change"
    hx-target="#course-grid-container"
    hx-swap="outerHTML"
    hx-indicator="#filter-spinner"
  >
    <!-- Loading Indicator -->
    <div id="filter-spinner" class="htmx-indicator mb-4">
      <div class="flex items-center gap-2 text-sm text-steel-blue-600">
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Updating results...
      </div>
    </div>

    <!-- Category Filter -->
    <fieldset class="mb-6">
      <legend class="text-sm font-semibold text-jet-black-800 dark:text-almond-cream-100 mb-3">
        Category
      </legend>
      <div class="space-y-2">
        {% for cat in categories %}
          <label class="flex items-center gap-2 text-sm text-jet-black-700 dark:text-almond-cream-200 cursor-pointer hover:text-steel-blue-600">
            <input
              type="radio"
              name="category"
              value="{{ cat.slug }}"
              class="h-4 w-4 text-steel-blue-600 border-steel-blue-300 focus:ring-steel-blue-500"
              {% if selected_category == cat.slug %}checked{% endif %}
              {% if not forloop.first and not selected_category %}{% if forloop.counter == 1 %}checked{% endif %}{% endif %}
            />
            <span>{{ cat.name }}</span>
            <span class="ml-auto text-xs text-jet-black-400 dark:text-jet-black-500">({{ cat.count }})</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <!-- Level Filter -->
    <fieldset class="mb-6">
      <legend class="text-sm font-semibold text-jet-black-800 dark:text-almond-cream-100 mb-3">
        Level
      </legend>
      <div class="space-y-2">
        {% for level in levels %}
          <label class="flex items-center gap-2 text-sm text-jet-black-700 dark:text-almond-cream-200 cursor-pointer hover:text-steel-blue-600">
            <input
              type="checkbox"
              name="level"
              value="{{ level.slug }}"
              class="h-4 w-4 rounded text-steel-blue-600 border-steel-blue-300 focus:ring-steel-blue-500"
              {% if level.slug in selected_levels %}checked{% endif %}
            />
            <span>{{ level.name }}</span>
            <span class="ml-auto text-xs text-jet-black-400 dark:text-jet-black-500">({{ level.count }})</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <!-- Price Range Filter -->
    <fieldset class="mb-6">
      <legend class="text-sm font-semibold text-jet-black-800 dark:text-almond-cream-100 mb-3">
        Price Range
      </legend>
      <div class="space-y-2">
        {% for range in price_ranges %}
          <label class="flex items-center gap-2 text-sm text-jet-black-700 dark:text-almond-cream-200 cursor-pointer hover:text-steel-blue-600">
            <input
              type="radio"
              name="price_range"
              value="{{ range.label }}"
              class="h-4 w-4 text-steel-blue-600 border-steel-blue-300 focus:ring-steel-blue-500"
              {% if selected_price == range.label %}checked{% endif %}
            />
            <span>{{ range.label }}</span>
            <span class="ml-auto text-xs text-jet-black-400 dark:text-jet-black-500">({{ range.count }})</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <!-- Duration Filter -->
    <fieldset class="mb-6">
      <legend class="text-sm font-semibold text-jet-black-800 dark:text-almond-cream-100 mb-3">
        Duration
      </legend>
      <div class="space-y-2">
        {% for dur in durations %}
          <label class="flex items-center gap-2 text-sm text-jet-black-700 dark:text-almond-cream-200 cursor-pointer hover:text-steel-blue-600">
            <input
              type="radio"
              name="duration"
              value="{{ dur.label }}"
              class="h-4 w-4 text-steel-blue-600 border-steel-blue-300 focus:ring-steel-blue-500"
              {% if selected_duration == dur.label %}checked{% endif %}
            />
            <span>{{ dur.label }}</span>
            <span class="ml-auto text-xs text-jet-black-400 dark:text-jet-black-500">({{ dur.count }})</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>

    <!-- Reset Button -->
    <button
      type="button"
      class="w-full px-4 py-2 text-sm font-medium text-steel-blue-600 dark:text-steel-blue-400 border border-steel-blue-300 dark:border-steel-blue-600 rounded-lg hover:bg-steel-blue-50 dark:hover:bg-jet-black-700 transition-colors"
      hx-get="{% url 'courses:list' %}"
      hx-target="#course-grid-container"
      hx-swap="outerHTML"
    >
      Clear All Filters
    </button>
  </form>
</aside>
