<!--
  Component: newsletter-signup.html
  Purpose: Email subscription component for newsletter signup.
           HTMX-powered form submission with inline result display.

  Context Variables:
    - form_url_name (str, optional) — Django URL name for signup endpoint (default: "newsletter:subscribe")
    - heading (str, optional) — Component heading (default: "Stay Updated")
    - description (str, optional) — Description text.
    - placeholder (str, optional) — Email input placeholder.

  HTMX Hooks:
    - hx-post="{% url 'newsletter:subscribe' %}"
    - hx-target="#newsletter-result"
    - hx-swap="innerHTML"

  SEO Notes:
    - Proper label and aria-describedby for email input.
    - Uses <form> with role="form".

  Dependencies:
    - Tailwind CSS
-->

<section
  class="bg-gradient-to-r from-steel-blue-600 to-deep-space-blue-700 py-12 lg:py-16"
  aria-label="Newsletter subscription"
>
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h2 class="text-2xl sm:text-3xl font-bold text-white mb-3">
      {{ heading|default:"Stay Updated" }}
    </h2>
    <p class="text-lg text-steel-blue-100 mb-8 max-w-xl mx-auto">
      {{ description|default:"Subscribe to our newsletter for the latest course updates, tips, and exclusive offers." }}
    </p>

    <form
      hx-post="{% url form_url_name|default:'newsletter:subscribe' %}"
      hx-target="#newsletter-result"
      hx-swap="innerHTML"
      hx-indicator="#newsletter-loading"
      class="flex flex-col sm:flex-row gap-3 max-w-lg mx-auto"
      role="form"
    >
      <label for="newsletter-email" class="sr-only">Email address</label>
      <input
        type="email"
        id="newsletter-email"
        name="email"
        required
        placeholder="{{ placeholder|default:'Enter your email address' }}"
        aria-describedby="newsletter-error"
        class="flex-grow px-4 py-3 text-base text-jet-black-900 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-sandy-brown-500 shadow-sm"
      />
      <button
        type="submit"
        class="px-6 py-3 text-base font-semibold rounded-lg text-white bg-sandy-brown-500 hover:bg-sandy-brown-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sandy-brown-500 transition-all shadow-md whitespace-nowrap"
        aria-label="Subscribe to newsletter"
      >
        Subscribe
      </button>
    </form>

    <!-- Loading -->
    <div id="newsletter-loading" class="htmx-indicator mt-4">
      <div class="flex items-center justify-center gap-2 text-sm text-steel-blue-100">
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Subscribing...
      </div>
    </div>

    <!-- Result -->
    <div id="newsletter-result" class="mt-4" role="status" aria-live="polite"></div>

    <!-- Privacy Note -->
    <p class="mt-4 text-xs text-steel-blue-200">
      We respect your privacy. Unsubscribe at any time.
    </p>
  </div>
</section>
