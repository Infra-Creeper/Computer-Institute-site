<!--
  Component: contact-form.html
  Purpose: Lead capture form with name, email, phone, course interest, and
           message fields. HTMX-powered submission without page reload.

  Context Variables:
    - form_action_url_name (str, optional) — Django URL name for form endpoint (default: "contact:submit")
    - courses (list of dicts, optional) — Course options for dropdown: { id (int), title (str) }
    - default_course_id (int, optional) — Pre-selected course ID

  HTMX Hooks:
    - Form submission:
      hx-post="{% url 'contact:submit' %}"
      hx-target="#form-result"
      hx-swap="innerHTML"
      hx-indicator="#form-loading"
    - Success/error messages injected into #form-result.

  SEO Notes:
    - Uses <form> with proper labels and aria-describedby for errors.
    - Required fields marked with aria-required.

  Dependencies:
    - Tailwind CSS
    - loading-spinner.html (for submission loading state)
-->

<section class="py-12 lg:py-16" aria-label="Contact us">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-jet-black-900 dark:text-almond-cream-50 mb-3">
        Get in Touch
      </h2>
      <p class="text-lg text-jet-black-700 dark:text-almond-cream-300">
        Have questions? Fill out the form below and we'll get back to you.
      </p>
    </div>

    <form
      hx-post="{% url form_action_url_name|default:'contact:submit' %}"
      hx-target="#form-result"
      hx-swap="innerHTML"
      hx-indicator="#form-loading"
      class="bg-white dark:bg-jet-black-800 rounded-xl border border-steel-blue-200 dark:border-jet-black-700 p-6 lg:p-8 shadow-sm space-y-5"
      novalidate
    >
      <!-- CSRF Token -->
      {% csrf_token %}

      <!-- Name -->
      <div>
        <label for="contact-name" class="block text-sm font-medium text-jet-black-800 dark:text-almond-cream-100 mb-1">
          Full Name <span class="text-sandy-brown-600" aria-hidden="true">*</span>
        </label>
        <input
          type="text"
          id="contact-name"
          name="name"
          required
          aria-required="true"
          aria-describedby="contact-name-error"
          placeholder="Enter your full name"
          class="block w-full px-4 py-3 text-base text-jet-black-900 dark:text-almond-cream-100 bg-white dark:bg-jet-black-900 border border-steel-blue-300 dark:border-jet-black-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-steel-blue-500 focus:border-transparent transition-shadow"
        />
        <p id="contact-name-error" class="hidden mt-1 text-sm text-sandy-brown-600" role="alert"></p>
      </div>

      <!-- Email -->
      <div>
        <label for="contact-email" class="block text-sm font-medium text-jet-black-800 dark:text-almond-cream-100 mb-1">
          Email Address <span class="text-sandy-brown-600" aria-hidden="true">*</span>
        </label>
        <input
          type="email"
          id="contact-email"
          name="email"
          required
          aria-required="true"
          aria-describedby="contact-email-error"
          placeholder="you@example.com"
          class="block w-full px-4 py-3 text-base text-jet-black-900 dark:text-almond-cream-100 bg-white dark:bg-jet-black-900 border border-steel-blue-300 dark:border-jet-black-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-steel-blue-500 focus:border-transparent transition-shadow"
        />
        <p id="contact-email-error" class="hidden mt-1 text-sm text-sandy-brown-600" role="alert"></p>
      </div>

      <!-- Phone -->
      <div>
        <label for="contact-phone" class="block text-sm font-medium text-jet-black-800 dark:text-almond-cream-100 mb-1">
          Phone Number
        </label>
        <input
          type="tel"
          id="contact-phone"
          name="phone"
          placeholder="+1 (555) 000-0000"
          class="block w-full px-4 py-3 text-base text-jet-black-900 dark:text-almond-cream-100 bg-white dark:bg-jet-black-900 border border-steel-blue-300 dark:border-jet-black-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-steel-blue-500 focus:border-transparent transition-shadow"
        />
      </div>

      <!-- Course Interest -->
      {% if courses %}
        <div>
          <label for="contact-course" class="block text-sm font-medium text-jet-black-800 dark:text-almond-cream-100 mb-1">
            Course of Interest
          </label>
          <select
            id="contact-course"
            name="course_id"
            class="block w-full px-4 py-3 text-base text-jet-black-900 dark:text-almond-cream-100 bg-white dark:bg-jet-black-900 border border-steel-blue-300 dark:border-jet-black-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-steel-blue-500 focus:border-transparent transition-shadow"
          >
            <option value="">Select a course...</option>
            {% for course in courses %}
              <option value="{{ course.id }}" {% if course.id == default_course_id %}selected{% endif %}>
                {{ course.title }}
              </option>
            {% endfor %}
          </select>
        </div>
      {% endif %}

      <!-- Message -->
      <div>
        <label for="contact-message" class="block text-sm font-medium text-jet-black-800 dark:text-almond-cream-100 mb-1">
          Message <span class="text-sandy-brown-600" aria-hidden="true">*</span>
        </label>
        <textarea
          id="contact-message"
          name="message"
          rows="4"
          required
          aria-required="true"
          aria-describedby="contact-message-error"
          placeholder="Tell us how we can help you..."
          class="block w-full px-4 py-3 text-base text-jet-black-900 dark:text-almond-cream-100 bg-white dark:bg-jet-black-900 border border-steel-blue-300 dark:border-jet-black-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-steel-blue-500 focus:border-transparent transition-shadow resize-y"
        ></textarea>
        <p id="contact-message-error" class="hidden mt-1 text-sm text-sandy-brown-600" role="alert"></p>
      </div>

      <!-- Submit Button -->
      <div>
        <button
          type="submit"
          class="w-full px-6 py-3 text-base font-semibold rounded-lg text-white bg-steel-blue-600 hover:bg-steel-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-steel-blue-500 transition-all shadow-md"
          aria-label="Submit contact form"
        >
          Send Message
        </button>
      </div>

      <!-- Loading Indicator -->
      <div id="form-loading" class="htmx-indicator flex items-center justify-center gap-2 text-sm text-steel-blue-600">
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Sending your message...
      </div>
    </form>

    <!-- Result Container -->
    <div id="form-result" class="mt-4" role="status" aria-live="polite"></div>
  </div>
</section>
