<!--
  Component: modal.html
  Purpose: Reusable modal dialog container. Can be triggered via HTMX or
           JavaScript. Supports dynamic content loading into modal body.

  Context Variables:
    - modal.id (str) — Required. Unique modal ID.
    - modal.title (str, optional) — Modal heading.
    - modal.size (str, optional) — 'sm', 'md' (default), 'lg', 'xl'
    - modal.content (str, optional) — Static HTML content for modal body.
    - modal.htmx_url (str, optional) — URL to load content via HTMX.

  HTMX Hooks:
    - Dynamic content loading:
      hx-get="{{ modal.htmx_url }}"
      hx-target="#modal-body-{{ modal.id }}"
      hx-swap="innerHTML"
    - Trigger opening via hx-trigger="click from:#open-modal-btn"

  SEO Notes:
    - Uses role="dialog" and aria-modal="true".
    - Focus trapping handled by JavaScript.

  Dependencies:
    - Tailwind CSS
-->

<!-- Modal Overlay -->
<div
  id="modal-overlay-{{ modal.id }}"
  class="hidden fixed inset-0 z-50 bg-jet-black-900/60 dark:bg-jet-black-950/80 backdrop-blur-sm"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-title-{{ modal.id }}"
  onclick="document.getElementById('modal-overlay-{{ modal.id }}').classList.add('hidden')"
>
  <!-- Modal Container -->
  <div
    class="flex items-center justify-center min-h-screen p-4"
    onclick="event.stopPropagation()"
  >
    <div
      class="bg-white dark:bg-jet-black-800 rounded-xl shadow-2xl w-full
             {% if modal.size == 'xl' %}max-w-4xl
             {% elif modal.size == 'lg' %}max-w-3xl
             {% elif modal.size == 'sm' %}max-w-sm
             {% else %}max-w-lg
             {% endif %}
             max-h-[90vh] overflow-y-auto"
    >
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-5 border-b border-steel-blue-200 dark:border-jet-black-700">
        {% if modal.title %}
          <h2
            id="modal-title-{{ modal.id }}"
            class="text-lg font-bold text-jet-black-900 dark:text-almond-cream-50"
          >
            {{ modal.title }}
          </h2>
        {% endif %}
        <button
          type="button"
          class="p-1 rounded-lg text-jet-black-500 hover:text-jet-black-900 dark:text-almond-cream-300 dark:hover:text-white hover:bg-steel-blue-50 dark:hover:bg-jet-black-700 transition-colors focus:outline-none focus:ring-2 focus:ring-steel-blue-500"
          aria-label="Close modal"
          onclick="document.getElementById('modal-overlay-{{ modal.id }}').classList.add('hidden')"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div
        id="modal-body-{{ modal.id }}"
        class="p-5"
        {% if modal.htmx_url %}
          hx-get="{{ modal.htmx_url }}"
          hx-trigger="load"
          hx-swap="innerHTML"
          hx-indicator="#modal-loading-{{ modal.id }}"
        {% endif %}
      >
        {% if modal.content %}
          {{ modal.content|safe }}
        {% elif not modal.htmx_url %}
          <p class="text-jet-black-600 dark:text-almond-cream-300">
            Modal content goes here.
          </p>
        {% endif %}

        <!-- Loading Indicator -->
        <div id="modal-loading-{{ modal.id }}" class="htmx-indicator flex items-center justify-center py-8">
          {% include "components/utils/loading-spinner.html" %}
        </div>
      </div>

      <!-- Optional Modal Footer -->
      <div id="modal-footer-{{ modal.id }}"></div>
    </div>
  </div>
</div>

<!-- Keyboard close support -->
<script>
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var overlay = document.getElementById('modal-overlay-{{ modal.id }}');
      if (overlay && !overlay.classList.contains('hidden')) {
        overlay.classList.add('hidden');
      }
    }
  });
</script>
