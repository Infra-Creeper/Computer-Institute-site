<!--
  Component: loading-spinner.html
  Purpose: Loading indicator for HTMX requests. Can be used as a standalone
           spinner or as an hx-indicator target.

  Context Variables:
    - spinner.label (str, optional) — Loading text (default: "Loading...")
    - spinner.size (str, optional) — 'sm' (default), 'md', 'lg'

  HTMX Hooks:
    - Use as indicator:
      hx-indicator="#loading-spinner-id"
    - The .htmx-request class is added to parent during HTMX requests.

  SEO Notes:
    - aria-live="polite" for screen reader announcements.

  Dependencies:
    - Tailwind CSS
-->

<div
  class="flex items-center justify-center gap-2 {% if spinner.size == 'lg' %}py-8{% elif spinner.size == 'md' %}py-4{% else %}py-2{% endif %}"
  aria-live="polite"
  aria-label="Loading"
>
  <svg
    class="animate-spin {% if spinner.size == 'lg' %}h-8 w-8{% elif spinner.size == 'md' %}h-6 w-6{% else %}h-4 w-4{% endif %} text-steel-blue-500"
    fill="none"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <circle
      class="opacity-25"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"
    ></circle>
    <path
      class="opacity-75"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
    ></path>
  </svg>
  {% if spinner.label %}
    <span class="text-sm text-steel-blue-600 dark:text-steel-blue-400">
      {{ spinner.label }}
    </span>
  {% else %}
    <span class="text-sm text-steel-blue-600 dark:text-steel-blue-400">
      Loading...
    </span>
  {% endif %}
</div>
