<!--
  Component: success-message.html
  Purpose: Success notification component with dismissible option.
           Used after successful form submissions or actions.

  Context Variables:
    - success.message (str) — Required. Success message text.
    - success.dismissible (bool, optional) — Whether dismissible (default: true).
    - success.auto_dismiss (int, optional) — Auto-dismiss after N ms.

  HTMX Hooks:
    - Can be rendered via hx-swap="innerHTML" after successful hx-post.

  SEO Notes:
    - Uses role="status" with aria-live="polite".

  Dependencies:
    - Tailwind CSS
-->

<div
  class="rounded-lg border border-steel-blue-300 dark:border-steel-blue-700 bg-steel-blue-50 dark:bg-steel-blue-900/20 p-4 flex items-start gap-3"
  role="status"
  aria-live="polite"
  aria-label="Success message"
  {% if success.id %}id="{{ success.id }}"{% endif %}
>
  <!-- Icon -->
  <svg
    class="h-5 w-5 flex-shrink-0 text-steel-blue-600 dark:text-steel-blue-400"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>

  <!-- Content -->
  <div class="flex-grow">
    <p class="text-sm font-semibold text-steel-blue-700 dark:text-steel-blue-300 mb-0.5">
      Success
    </p>
    <p class="text-sm text-jet-black-700 dark:text-almond-cream-200">
      {{ success.message }}
    </p>
  </div>

  <!-- Dismiss Button -->
  {% if success.dismissible != False %}
    <button
      type="button"
      class="flex-shrink-0 p-1 rounded text-steel-blue-400 hover:text-steel-blue-600 dark:text-steel-blue-500 dark:hover:text-steel-blue-300 hover:bg-white/50 dark:hover:bg-jet-black-700 transition-colors focus:outline-none focus:ring-2 focus:ring-steel-blue-500"
      aria-label="Dismiss success message"
      onclick="this.closest('[role=status]').remove()"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  {% endif %}
</div>

{% if success.auto_dismiss %}
<script>
  setTimeout(function () {
    var el = document.getElementById('{{ success.id|default:"" }}');
    if (el) el.remove();
  }, {{ success.auto_dismiss }});
</script>
{% endif %}
