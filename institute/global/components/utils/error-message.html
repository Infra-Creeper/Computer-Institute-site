<!--
  Component: error-message.html
  Purpose: Error/alert message component with dismissible option.
           Supports inline errors and full-page error displays.

  Context Variables:
    - error.message (str) — Required. Error message text.
    - error.code (str, optional) — Error code (e.g., "404", "VALIDATION_ERROR").
    - error.dismissible (bool, optional) — Whether the error can be dismissed (default: true).
    - error.type (str, optional) — 'error' (default), 'warning', 'info'

  HTMX Hooks: None — static display. Can be swapped via hx-swap.

  SEO Notes:
    - Uses role="alert" for screen readers.

  Dependencies:
    - Tailwind CSS
-->

<div
  class="rounded-lg border p-4 flex items-start gap-3
         {% if error.type == 'warning' %}bg-sandy-brown-50 dark:bg-sandy-brown-900/20 border-sandy-brown-300 dark:border-sandy-brown-700
         {% elif error.type == 'info' %}bg-deep-space-blue-50 dark:bg-deep-space-blue-900/20 border-deep-space-blue-300 dark:border-deep-space-blue-700
         {% else %}bg-sandy-brown-50 dark:bg-sandy-brown-900/20 border-sandy-brown-300 dark:border-sandy-brown-700
         {% endif %}"
  role="alert"
  aria-label="Error message"
  {% if error.id %}id="{{ error.id }}"{% endif %}
>
  <!-- Icon -->
  <svg
    class="h-5 w-5 flex-shrink-0 {% if error.type == 'warning' %}text-sandy-brown-600{% elif error.type == 'info' %}text-deep-space-blue-600{% else %}text-sandy-brown-600{% endif %}"
    fill="none"
    stroke="currentColor"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>

  <!-- Content -->
  <div class="flex-grow">
    {% if error.code %}
      <p class="text-sm font-semibold text-jet-black-900 dark:text-almond-cream-50 mb-0.5">
        Error {{ error.code }}
      </p>
    {% endif %}
    <p class="text-sm text-jet-black-700 dark:text-almond-cream-200">
      {{ error.message }}
    </p>
  </div>

  <!-- Dismiss Button -->
  {% if error.dismissible != False %}
    <button
      type="button"
      class="flex-shrink-0 p-1 rounded text-jet-black-400 hover:text-jet-black-600 dark:text-almond-cream-400 dark:hover:text-almond-cream-200 hover:bg-white/50 dark:hover:bg-jet-black-700 transition-colors focus:outline-none focus:ring-2 focus:ring-steel-blue-500"
      aria-label="Dismiss error message"
      onclick="this.closest('[role=alert]').remove()"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  {% endif %}
</div>
