<!--
  Component: stat-counter.html
  Purpose: Animated counter component that counts up to a target value when
           scrolled into view. Supports suffix (e.g., "+", "%", "K").

  Context Variables:
    - stat.value (int) — Required. Target number to count to.
    - stat.suffix (str, optional) — Text appended after number (default: "").
    - stat.prefix (str, optional) — Text prepended before number (default: "").
    - stat.label (str) — Required. Descriptive label below the number.
    - stat.duration (int, optional) — Animation duration in ms (default: 2000).

  HTMX Hooks:
    - Optional dynamic value loading:
      hx-get="{% url 'stats:count' %}"
      hx-trigger="revealed"
      hx-swap="innerHTML"
      hx-target="this"

  SEO Notes:
    - Uses <span> with proper aria-label for screen readers.

  Dependencies:
    - Tailwind CSS
-->

<div
  class="text-center"
  role="figure"
  aria-label="{{ stat.label }}: {{ stat.prefix|default:'' }}{{ stat.value|default:0 }}{{ stat.suffix|default:'' }}"
>
  <div class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-2">
    <span
      class="stat-counter-value"
      data-target="{{ stat.value|default:0 }}"
      data-suffix="{{ stat.suffix|default:'' }}"
      data-prefix="{{ stat.prefix|default:'' }}"
      data-duration="{{ stat.duration|default:2000 }}"
    >
      {{ stat.prefix|default:'' }}0{{ stat.suffix|default:'' }}
    </span>
  </div>
  <p class="text-steel-blue-100 dark:text-steel-blue-200 text-sm sm:text-base font-medium uppercase tracking-wide">
    {{ stat.label }}
  </p>
</div>

<script>
  // Intersection Observer for animated counters
  (function () {
    var counters = document.querySelectorAll('.stat-counter-value');
    if (!counters.length) return;

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          var el = entry.target;
          var target = parseInt(el.getAttribute('data-target'), 10);
          var suffix = el.getAttribute('data-suffix') || '';
          var prefix = el.getAttribute('data-prefix') || '';
          var duration = parseInt(el.getAttribute('data-duration'), 10) || 2000;
          var start = 0;
          var startTime = null;

          function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            var progress = Math.min((timestamp - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
            var current = Math.floor(eased * target);
            el.textContent = prefix + current.toLocaleString() + suffix;
            if (progress < 1) {
              requestAnimationFrame(animate);
            } else {
              el.textContent = prefix + target.toLocaleString() + suffix;
            }
          }

          requestAnimationFrame(animate);
          observer.unobserve(el);
        }
      });
    }, { threshold: 0.5 });

    counters.forEach(function (counter) {
      observer.observe(counter);
    });
  })();
</script>
