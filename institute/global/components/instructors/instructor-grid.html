<!--
  Component: instructor-grid.html
  Purpose: Grid layout for displaying multiple instructor cards.
           Responsive grid with consistent spacing.

  Context Variables:
    - instructors (list) — Django QuerySet or list of instructor objects.
    - grid_cols (str, optional) — CSS grid column class (default: "lg:grid-cols-3")

  HTMX Hooks: None — static grid. Can be wrapped for dynamic loading.

  SEO Notes:
    - Uses <section> with aria-label.
    - Each card uses schema.org Person data.

  Dependencies:
    - Tailwind CSS
    - instructor-card.html
-->

<section aria-label="Our instructors" class="py-12 lg:py-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="text-center mb-10">
      <h2 class="text-3xl sm:text-4xl font-bold text-jet-black-900 dark:text-almond-cream-50 mb-3">
        Meet Our Expert Instructors
      </h2>
      <p class="text-lg text-jet-black-700 dark:text-almond-cream-300 max-w-2xl mx-auto">
        Learn from industry professionals with years of real-world experience.
      </p>
    </div>

    <!-- Instructor Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 {{ grid_cols|default:'lg:grid-cols-3' }} gap-6 lg:gap-8">
      {% for instructor in instructors %}
        {% include "components/instructors/instructor-card.html" %}
      {% endfor %}
    </div>
  </div>
</section>
