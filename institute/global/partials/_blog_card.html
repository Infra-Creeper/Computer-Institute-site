<article class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-steel-blue-100"><img src="{{ post.featured_image_url|default:'/static/images/blog-placeholder.jpg' }}" alt="{{ post.featured_image_alt|default:post.title }}" loading="lazy" class="h-48 w-full object-cover"><div class="p-5"><p class="text-xs font-semibold uppercase tracking-wide text-sandy-brown-600">{{ post.category.name|default:post.category }}</p><h3 class="mt-2 text-lg font-bold text-deep-space-blue-900"><a href="/blog/{{ post.slug }}/">{{ post.title }}</a></h3><p class="mt-2 text-sm text-jet-black-600">{{ post.excerpt|truncatewords:25 }}</p><div class="mt-4 text-xs text-jet-black-500">By {{ post.author.name|default:post.author }} · {{ post.published_at|date:'d M Y' }} · {{ post.read_time|default:'5 min read' }}</div></div></article>
