<article class="flex h-full flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-steel-blue-100"><img src="{{ course.image_url|default:'/static/images/course-placeholder.jpg' }}" alt="{{ course.image_alt|default:course.title }}" loading="lazy" class="h-44 w-full object-cover"><div class="flex flex-1 flex-col p-5"><p class="text-xs font-semibold uppercase tracking-wide text-sandy-brown-600">{{ course.category.name|default:course.category }}</p><h3 class="mt-2 text-lg font-bold text-deep-space-blue-900"><a href="/courses/{{ course.slug }}/" class="hover:text-sandy-brown-600">{{ course.title }}</a></h3><p class="mt-2 flex-1 text-sm text-jet-black-600">{{ course.excerpt|default:course.description|truncatewords:24 }}</p><div class="mt-4 flex items-center justify-between text-sm"><span>{{ course.duration|default:'Flexible duration' }}</span><span class="font-bold text-deep-space-blue-700">{{ course.fee_display|default:course.fee }}</span></div></div></article>
