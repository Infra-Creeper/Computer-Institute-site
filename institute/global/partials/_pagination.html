{% if page_obj.has_previous %}<button hx-get="{{ pagination_base_url }}?page={{ page_obj.previous_page_number }}{% if query_string %}&{{ query_string }}{% endif %}" hx-target="{{ pagination_target|default:'#pagination' }}" hx-swap="outerHTML" class="rounded-lg border border-steel-blue-200 px-4 py-2 text-sm hover:bg-steel-blue-50">Previous</button>{% endif %}<span class="px-4 text-sm text-jet-black-600">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<button hx-get="{{ pagination_base_url }}?page={{ page_obj.next_page_number }}{% if query_string %}&{{ query_string }}{% endif %}" hx-target="{{ pagination_target|default:'#pagination' }}" hx-swap="outerHTML" class="rounded-lg bg-deep-space-blue-700 px-4 py-2 text-sm font-semibold text-white hover:bg-deep-space-blue-800">Next</button>{% endif %}
