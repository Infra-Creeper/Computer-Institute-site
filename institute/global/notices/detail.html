<div class="mx-auto max-w-2xl rounded-2xl bg-white p-6 shadow-2xl"><div class="flex justify-between"><p class="text-sm text-jet-black-500">{{ notice.date|date:'d M Y' }}</p><button onclick="this.closest('#modal').classList.add('hidden')" aria-label="Close notice">×</button></div><h2 class="mt-2 text-2xl font-bold text-deep-space-blue-950">{{ notice.title }}</h2><div class="prose mt-5">{{ notice.content|safe }}</div>{% if notice.attachment_url %}<a href="{{ notice.attachment_url }}" download class="mt-5 inline-block font-semibold text-deep-space-blue-700">Download attachment</a>{% endif %}</div>
