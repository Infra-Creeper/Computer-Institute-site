<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Primary SEO Meta Tags -->
  <title>{% block title %}Computer Training Institute — Expert Tech Courses{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Master industry-leading technologies with hands-on courses designed by professionals. Enroll in Python, Web Development, Data Science, and more.{% endblock %}" />
  <meta name="keywords" content="{% block meta_keywords %}computer training, coding courses, web development, data science, python, django, programming courses{% endblock %}" />
  <meta name="author" content="{{ institute.name|default:'Computer Training Institute' }}" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{% block canonical_url %}{{ request.build_absolute_uri }}{% endblock %}" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% block og_title %}{{ institute.name|default:'Computer Training Institute' }}{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}{{ institute.description|default:'Expert-led computer training programs for career growth.' }}{% endblock %}" />
  <meta property="og:image" content="{% block og_image %}{{ institute.og_image_url|default:'/static/images/og-default.jpg' }}{% endblock %}" />
  <meta property="og:url" content="{{ request.build_absolute_uri }}" />
  <meta property="og:site_name" content="{{ institute.name|default:'Computer Training Institute' }}" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block twitter_title %}{{ institute.name|default:'Computer Training Institute' }}{% endblock %}" />
  <meta name="twitter:description" content="{% block twitter_description %}{{ institute.description|default:'Expert-led computer training programs.' }}{% endblock %}" />
  <meta name="twitter:image" content="{% block twitter_image %}{{ institute.og_image_url|default:'/static/images/og-default.jpg' }}{% endblock %}" />

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

  <!-- Tailwind CSS (CDN for development; use compiled version in production) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            "steel-blue": {
              50: "#eef3f6", 100: "#dde8ee", 200: "#bcd0dc",
              300: "#9ab9cb", 400: "#78a2ba", 500: "#578aa8",
              600: "#456f87", 700: "#345365", 800: "#233743",
              900: "#111c22", 950: "#0c1318"
            },
            "jet-black": {
              50: "#eef2f6", 100: "#dde5ee", 200: "#bbcbdd",
              300: "#99b1cc", 400: "#7797bb", 500: "#557daa",
              600: "#446488", 700: "#334b66", 800: "#223244",
              900: "#111922", 950: "#0c1118"
            },
            "sandy-brown": {
              50: "#fdf2e7", 100: "#fbe4d0", 200: "#f8c9a0",
              300: "#f4ae71", 400: "#f19341", 500: "#ed7812",
              600: "#be600e", 700: "#8e480b", 800: "#5f3007",
              900: "#2f1804", 950: "#211102"
            },
            "almond-cream": {
              50: "#faf3eb", 100: "#f5e7d6", 200: "#eaceae",
              300: "#e0b685", 400: "#d59d5d", 500: "#cb8534",
              600: "#a26a2a", 700: "#7a501f", 800: "#513515",
              900: "#291b0a", 950: "#1c1307"
            },
            "deep-space-blue": {
              50: "#eaf3fa", 100: "#d5e6f6", 200: "#accdec",
              300: "#82b4e3", 400: "#599bd9", 500: "#2f82d0",
              600: "#2668a6", 700: "#1c4e7d", 800: "#133453",
              900: "#091a2a", 950: "#07121d"
            }
          }
        }
      }
    }
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />

  <!-- HTMX Loading Bar -->
  <style>
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-white dark:bg-jet-black-900 text-jet-black-900 dark:text-almond-cream-100 antialiased min-h-screen flex flex-col">

  {% block body_start %}{% endblock %}

  {% block content %}
    <!-- Page content goes here -->
  {% endblock %}

  {% block footer %}
    {% include "components/footer/footer.html" %}
  {% endblock %}

  {% block extra_scripts %}{% endblock %}

</body>
</html>
